<section class="legal"><div style="max-width:820px;margin:0 auto"><span class="demo" data-zh="草稿 · 待律师审核" data-en="DRAFT · pending legal review">x</span><h2 data-zh="使用条款" data-en="Terms of Use">使用条款</h2><h3 data-zh="筹建阶段" data-en="Preparatory stage">筹建阶段</h3><p data-zh="本网站为筹建阶段网站。基金会尚未登记；正式登记前，所有已开放的网站功能均免费测试。正式登记、开设银行账户后启动订阅与捐赠；订阅须由用户主动选择并确认价格及条款，测试不会自动转为付费。" data-en="This is a preparatory-stage website. The foundation is not yet registered; all available website features are free to test. Subscriptions and donations open after formal registration and bank account opening. A subscription requires the user to choose and confirm the price and terms; testing never automatically becomes a paid plan.">本网站为筹建阶段网站。基金会尚未登记；正式登记前，所有已开放的网站功能均免费测试。正式登记、开设银行账户后启动订阅与捐赠；订阅须由用户主动选择并确认价格及条款，测试不会自动转为付费。</p><h3 data-zh="文明 ID" data-en="Civilization ID">文明 ID</h3><p data-zh="文明 ID 是基金会内的贡献身份，不是护照、国籍或任何法定身份证件。" data-en="A Civilization ID is a contribution identity within QCF, not a passport, citizenship or legal identity document.">文明 ID 是基金会内的贡献身份，不是护照、国籍或任何法定身份证件。</p><h3 data-zh="贡献值 Q" data-en="Contribution points Q">贡献值 Q</h3><p data-zh="Q 是记录在文明 ID 下的贡献值，不可转让、不可交易，不是加密货币或金融工具，没有货币价值，不能兑换为金钱。" data-en="Q is a contribution point recorded under a Civilization ID. It is non-transferable, not tradable, not a cryptocurrency or financial instrument, has no monetary value and cannot be redeemed for money.">Q 是记录在文明 ID 下的贡献值，不可转让、不可交易，不是加密货币或金融工具，没有货币价值，不能兑换为金钱。</p><h3 data-zh="无税务承诺" data-en="No tax claims">无税务承诺</h3><p data-zh="本网站不对任何捐赠的税务处理作出承诺。" data-en="No statement is made about the tax treatment of any donation.">本网站不对任何捐赠的税务处理作出承诺。</p></div></section>
