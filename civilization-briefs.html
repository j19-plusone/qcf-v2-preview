<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>文明共建简报 | QCF Research & Publications</title><style>body{background:#060e1b;color:#f4f0e9;font:16px/1.7 system-ui,-apple-system,sans-serif;margin:0}header,main,footer{max-width:980px;margin:auto;padding:25px}header{border-bottom:1px solid #d5b67a55;display:flex;justify-content:space-between;align-items:center}header img{width:54px}h1{font:clamp(30px,4vw,48px)/1.2 Georgia,serif}a{color:#e2c58d;text-decoration:none}a:hover{text-decoration:underline}.eyebrow{letter-spacing:.16em;font-size:12px;color:#d5b67a}select{background:#172531;color:#f4f0e9;border:1px solid #d5b67a;padding:9px;border-radius:8px}.item{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:19px 0;border-bottom:1px solid #ffffff28}.date{color:#b8c3cd;font-size:14px}.note{font-size:13px;color:#b8c3cd}footer{border-top:1px solid #d5b67a44;margin-top:70px}@media(max-width:600px){header,main,footer{padding:18px}.item{grid-template-columns:1fr;gap:3px}}</style></head><body><header><a href="index.html"><img src="brand/qcf-official-logo.svg" alt="QCF"></a><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option></select></header><main><div class="eyebrow">QCF · RESEARCH & PUBLICATIONS</div><h1 id="heading">文明共建简报</h1><p class="note" id="description">按发布时间倒序排列；每页最多展示10篇，未来新增文章自动进入分页。</p><div id="list"></div><div id="pagination" class="note" style="padding:22px 0"></div><p><a href="index.html" id="back">← 返回首页</a></p></main><footer>QCF · Quantum Civilization Foundation · Preparatory stage</footer><script>
const briefs=[{date:'2026-10-28',zh:'一人药企的早期实验：AI与机器人如何改变药物发现',en:'The One-Person Biotech Experiment: AI, Robotics and Drug Discovery',href:'life-sciences-brief-20261030.html'},{date:'2026-10-24',zh:'思考人类：人类健康数据主权与公平价值分享',en:'Rethinking Humanity: Human Health Data Sovereignty & Equitable Benefit Sharing',href:'civilization-brief-20261024.html'}];
const select=document.getElementById('language');const qs=new URLSearchParams(location.search);let lang=qs.get('lang')||localStorage.getItem('qcf_lang')||'zh';const pageSize=10;let page=Math.max(1,Number(qs.get('page'))||1);
function draw(){const en=lang==='en';document.documentElement.lang=en?'en':'zh-CN';select.value=lang;document.getElementById('heading').textContent=en?'Co-Building Civilization Brief':'文明共建简报';document.getElementById('description').textContent=en?'Newest first · Up to 10 briefs per page.':'按发布时间倒序排列 · 每页最多展示10篇。';document.getElementById('back').textContent=en?'← Back to home':'← 返回首页';const items=[...briefs].sort((a,b)=>b.date.localeCompare(a.date));const total=Math.max(1,Math.ceil(items.length/pageSize));page=Math.min(page,total);document.getElementById('list').innerHTML=items.slice((page-1)*pageSize,page*pageSize).map(b=>'<div class="item"><time class="date" datetime="'+b.date+'">'+b.date+'</time><a href="'+b.href+'?lang='+lang+'">'+(en?b.en:b.zh)+' ↗</a></div>').join('');document.getElementById('pagination').textContent=(en?'Page ':'第 ')+page+(en?' of ':' / ')+total+(en?'':' 页');}
select.onchange=()=>{lang=select.value;localStorage.setItem('qcf_lang',lang);if(!['zh','en'].includes(lang)){const target=location.origin+location.pathname+'?lang=en';location.href='https://translate.google.com/translate?sl=en&tl='+encodeURIComponent(lang)+'&u='+encodeURIComponent(target);return}draw()};if(!['zh','en'].includes(lang))lang='en';draw();
</script></body></html>
