<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#060e1b"><title>注册文明 ID · QCF 量子文明基金会 · 免费测试</title><link rel="icon" href="brand/qcf-q-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css?v=20261026"></head><body><main>
<section><div class="panel"><p class="note" data-zh="基金会筹备阶段 · 文明共建者登记与QCF专属简报全部免费。当前页面仍为浏览器测试登记；正式CRM与邮箱验证接口上线后，将使用邮箱完成双重确认、兴趣订阅与跨设备文明ID记录。" data-en="Foundation preparation stage · Civilization Co-builder registration and QCF exclusive briefs are free. This page is still a browser-based test registration; once the CRM and email-verification service is deployed, email will support double opt-in, topic preferences and cross-device Civilization ID records.">基金会筹备阶段 · 文明共建者登记与QCF专属简报全部免费。</p>
<div id="s1"><div class="civhead"><img src="brand/qcf-civ-id-mark.svg" alt=""><div>QCF CIVILIZATION ID</div></div><div class="eyebrow">STEP 1 / 3</div><h2 data-zh="注册文明共建者 / 文明 ID" data-en="Register as a Civilization Co-builder / Civilization ID">注册文明共建者 / 文明 ID</h2><p class="mute" data-zh="正式系统仅需要必要的联系信息；无需填写国籍、人种或信仰。请选择你希望免费接收的QCF简报与公共参与通知。" data-en="The production system will request only necessary contact information; nationality, race and belief are not required. Choose the QCF briefs and public-participation notices you wish to receive free of charge.">请选择你希望免费接收的QCF简报与公共参与通知。</p>
<label for="em">Email</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email">
<label for="nm" data-zh="文明使者名（可选）" data-en="Civilization Envoy name (optional)">x</label><input id="nm" type="text" maxlength="32" placeholder="e.g. Aurora · 星河">
<fieldset style="border:1px solid #ffffff24;border-radius:12px;padding:14px 16px;margin:18px 0"><legend class="gold" data-zh="我感兴趣的QCF内容（至少选择一项）" data-en="My QCF interests (choose at least one)">我感兴趣的QCF内容（至少选择一项）</legend>
<div class="chk"><input class="interest" type="checkbox" id="i-e" value="qcf-e" checked><label for="i-e" style="margin:0" data-zh="QCF-E｜量子科技与能源" data-en="QCF-E | Quantum Technology & Energy">QCF-E｜量子科技与能源</label></div>
<div class="chk"><input class="interest" type="checkbox" id="i-l" value="qcf-l"><label for="i-l" style="margin:0" data-zh="QCF-L｜生命科学" data-en="QCF-L | Life Sciences">QCF-L｜生命科学</label></div>
<div class="chk"><input class="interest" type="checkbox" id="i-u" value="qcf-u"><label for="i-u" style="margin:0" data-zh="QCF-U｜文明研究" data-en="QCF-U | Civilization Research">QCF-U｜文明研究</label></div>
<div class="chk"><input class="interest" type="checkbox" id="i-a" value="activities"><label for="i-a" style="margin:0" data-zh="QCF公益活动通知" data-en="QCF Public-Interest Activities">QCF公益活动通知</label></div>
<div class="chk"><input class="interest" type="checkbox" id="i-v" value="votes-initiatives"><label for="i-v" style="margin:0" data-zh="QCF文明投票与倡议" data-en="QCF Civilization Votes & Initiatives">QCF文明投票与倡议</label></div>
</fieldset>
<div class="chk"><input type="checkbox" id="hide" checked><label for="hide" style="margin:0" data-zh="隐藏我的原有身份，对外只显示 ID 或使者名" data-en="Hide my original identity; show only my ID or envoy name">x</label></div>
<div class="chk"><input type="checkbox" id="ok"><label for="ok" style="margin:0" data-zh="我已阅读<a class=gold href=privacy.html>隐私政策</a>与<a class=gold href=terms.html>使用条款</a>，理解这是演示，基建费将在基金会登记后开放" data-en="I have read the <a class=gold href=privacy.html>Privacy</a> and <a class=gold href=terms.html>Terms</a> and understand this is a demo; fees open after registration">x</label></div>
<p><button class="btn" id="go" data-zh="开始免费测试" data-en="Start free testing">x</button></p>
<p class="note" data-zh="当前测试版：邮箱与兴趣只保存在你的浏览器里，不会发送真实邮件。CRM接口源码已经准备完成；待qcf.org.cn发信域DNS验证及生产后端部署后，将启用邮箱双重确认与定期简报派送。" data-en="Current test version: your email and interests remain in this browser and no real email is sent. The CRM API source is ready; double opt-in and periodic brief delivery will activate after qcf.org.cn DNS verification and production backend deployment.">当前测试版：邮箱与兴趣只保存在你的浏览器里，不会发送真实邮件。</p></div>
<div id="s2" class="hide" style="text-align:center"><div class="eyebrow">STEP 2 / 3</div><div style="font-size:64px">✉︎</div><h2 data-zh="体验文明 ID 创建" data-en="Try creating a Civilization ID">体验文明 ID 创建</h2><p class="mute"><span data-zh="测试邮箱：" data-en="Test email:">x</span> <b id="em2"></b> <span data-zh="。此流程不发送邮件，也不验证邮箱归属。" data-en="No email is sent and email ownership is not verified.">x</span></p>
<div class="card" style="text-align:left;margin:22px 0"><span class="demo">LOCAL TEST</span><p><b>QCF · Free testing</b><br><span data-zh="体验文明 ID 流程" data-en="Try the Civilization ID flow">x</span></p><button class="btn" id="ver" data-zh="创建本机测试 ID" data-en="Create a local test ID">x</button></div></div>
<div id="s3" class="hide"><div class="eyebrow">STEP 3 / 3 · ISSUED</div><h2 data-zh="欢迎你，文明共建者" data-en="Welcome, Civilization Co-builder">欢迎你，文明共建者</h2><div id="card"></div>
<p style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="id.html" data-zh="进入我的 ID" data-en="Open my ID">x</a><button class="btn ghost" id="reset" data-zh="重置演示" data-en="Reset demo">x</button></p></div>
</div></section>
</main><script src="assets/app.js?v=20261026"></script><script>
const $=i=>document.getElementById(i);
function show(n){['s1','s2','s3'].forEach((s,i)=>$(s).classList.toggle('hide',i!==n-1));scrollTo(0,0)}
async function card(u){const auth=u.auth||{};$('card').innerHTML=`<div class="idcard v1"><div class="brandrow"><img class="fp" src="brand/qcf-civ-id-mark.svg" alt=""><div class="brandtext"><div class="eyebrow">QCF CIVILIZATION ID</div><div class="num counter" id="cnum"></div></div></div><div class="serif name">${QCF.escape(u.name||QCF.t('文明共建者','Civilization Co-builder'))}</div><div class="meta"><dl><dt>${QCF.t('签发日期','ISSUED')}</dt><dd>${u.issued}</dd><dt>${QCF.t('验证代码','VERIFICATION CODE')}</dt><dd class="counter">${u.code}</dd><dt>${QCF.t('身份显示','IDENTITY DISPLAY')}</dt><dd>${u.hide?QCF.t('原始身份已隐藏','Original identity hidden'):QCF.t('原始身份可见','Original identity visible')}</dd></dl><div>${QCF.qr(u.fp)}<div class="small mute" style="text-align:center">QCF ID · QR</div></div></div><div class="auth-grid"><div class="auth-pill ok"><b>EMAIL</b>${QCF.t('已登记','Registered')}</div><div class="auth-pill ${auth.phone?'ok':'off'}"><b>PHONE</b>${auth.phone?QCF.t('已验证','Verified'):QCF.t('未绑定','Not linked')}</div><div class="auth-pill ${auth.passkey?'ok':'off'}"><b>PASSKEY</b>${auth.passkey?QCF.t('已绑定','Linked'):QCF.t('未绑定','Not linked')}</div><div class="auth-pill ${auth.apple?'ok':'off'}"><b>APPLE</b>${auth.apple?QCF.t('已绑定','Linked'):QCF.t('未绑定','Not linked')}</div><div class="auth-pill ${auth.google?'ok':'off'}"><b>GOOGLE</b>${auth.google?QCF.t('已绑定','Linked'):QCF.t('未绑定','Not linked')}</div><div class="auth-pill ${auth.dna?'ok':'off'}"><b>DNA CREDENTIAL</b>${auth.dna?QCF.t('凭证已验证','Credential verified'):QCF.t('未绑定','Not linked')}</div></div><div class="tag small mute" style="margin-top:12px">One Human. One Civilization ID.</div><div class="small mute" style="margin-top:8px">${QCF.t('简报兴趣','BRIEF INTERESTS')}: ${(u.topics||[]).map(x=>QCF.escape(x)).join(' · ')||'—'}</div><div class="privacy-note">${QCF.t('QCF不保存原始指纹、Face ID/面部模板、DNA序列或Apple/Google私钥；Passkey仅保存公钥凭证。','QCF does not store raw fingerprints, Face ID/face templates, DNA sequences, or Apple/Google private keys; Passkeys store public-key credentials only.')}</div></div>`;QCF.odo(document.getElementById('cnum'),'2026000000');setTimeout(()=>QCF.odo(document.getElementById('cnum'),u.id),150)}
const u=QCF.S.u;if(u&&u.verified){show(3);card(u)}else if(u){show(2);$('em2').textContent=u.email}
$('go').onclick=()=>{const e=$('em').value.trim(),topics=[...document.querySelectorAll('.interest:checked')].map(x=>x.value);if(!/^\S+@\S+\.\S+$/.test(e)){QCF.toast(QCF.t('请输入有效邮箱','Please enter a valid email'));return}if(!topics.length){QCF.toast(QCF.t('请至少选择一项感兴趣内容','Choose at least one interest'));return}if(!$('ok').checked){QCF.toast(QCF.t('请先勾选同意','Please accept first'));return}
QCF.S.u={email:e,name:$('nm').value.trim(),hide:$('hide').checked,topics,verified:false};$('em2').textContent=e;show(2)};
$('ver').onclick=async()=>{const u=QCF.S.u;u.verified=true;const st=await (await fetch('data/stats.json',{cache:'no-store'})).json();u.id=QCF.idFor(st.registered_ids+1);localStorage.setItem('qcf_regs','1');u.issued=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});u.fp=await QCF.hash(u.id+'|'+u.email+'|'+u.issued);u.code=u.fp.slice(0,6).toUpperCase();QCF.S.u=u;QCF.S.h=[];show(3);await card(u);QCF.award(5,'注册文明 ID','Civilization ID registered')};
$('reset').onclick=()=>{localStorage.removeItem('qcf_user');localStorage.removeItem('qcf_hist');localStorage.removeItem('qcf_ck');localStorage.removeItem('qcf_sh');localStorage.removeItem('qcf_regs');location.reload()};
document.addEventListener('qcf-lang',()=>{const u=QCF.S.u;if(u&&u.verified)card(u)});
</script></body></html>
