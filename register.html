<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#060e1b"><title>注册文明 ID · QCF 量子文明基金会 (Design Preview)</title><link rel="icon" href="brand/qcf-q-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"></head><body><main>
<section><div class="panel">
<div id="s1"><div class="civhead"><img src="brand/qcf-civ-id-mark.svg" alt=""><div>QCF CIVILIZATION ID</div></div><div class="eyebrow">STEP 1 / 3</div><h2 data-zh="领取你的文明 ID" data-en="Claim your Civilization ID">领取你的文明 ID</h2><p class="mute" data-zh="无需国籍、人种或信仰信息。只需一个邮箱用于验证。" data-en="No nationality, race or belief needed — just an email for verification.">无需国籍、人种或信仰信息。只需一个邮箱用于验证。</p>
<label for="em">Email</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email">
<label for="nm" data-zh="文明使者名（可选）" data-en="Civilization Envoy name (optional)">x</label><input id="nm" type="text" maxlength="32" placeholder="e.g. Aurora · 星河">
<div class="chk"><input type="checkbox" id="hide" checked><label for="hide" style="margin:0" data-zh="隐藏我的原有身份，对外只显示 ID 或使者名" data-en="Hide my original identity; show only my ID or envoy name">x</label></div>
<div class="chk"><input type="checkbox" id="ok"><label for="ok" style="margin:0" data-zh="我已阅读<a class=gold href=privacy.html>隐私政策</a>与<a class=gold href=terms.html>使用条款</a>，理解这是演示，基建费将在基金会登记后开放" data-en="I have read the <a class=gold href=privacy.html>Privacy</a> and <a class=gold href=terms.html>Terms</a> and understand this is a demo; fees open after registration">x</label></div>
<p><button class="btn" id="go" data-zh="发送验证链接" data-en="Send verification link">x</button></p>
<p class="note" data-zh="演示版：邮箱只保存在你的浏览器里，不会发送真实邮件。" data-en="Demo: your email stays in this browser; no real email is sent.">演示版：邮箱只保存在你的浏览器里，不会发送真实邮件。</p></div>
<div id="s2" class="hide" style="text-align:center"><div class="eyebrow">STEP 2 / 3</div><div style="font-size:64px">✉︎</div><h2 data-zh="验证链接已发送" data-en="Verification link sent">验证链接已发送</h2><p class="mute"><span data-zh="请查收发往" data-en="Check the inbox of">x</span> <b id="em2"></b> <span data-zh="的邮件，点击链接完成验证。" data-en="and click the link to verify.">x</span></p>
<div class="card" style="text-align:left;margin:22px 0"><span class="demo">DEMO INBOX</span><p><b>QCF &lt;id@qcf.org.cn&gt;</b><br><span data-zh="验证你的文明 ID" data-en="Verify your Civilization ID">x</span></p><button class="btn" id="ver" data-zh="✓ 验证我的邮箱" data-en="✓ Verify my email">x</button></div></div>
<div id="s3" class="hide"><div class="eyebrow">STEP 3 / 3 · ISSUED</div><h2 data-zh="欢迎你，文明共建者" data-en="Welcome, Civilization Co-builder">欢迎你，文明共建者</h2><div id="card"></div>
<p style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="id.html" data-zh="进入我的 ID" data-en="Open my ID">x</a><button class="btn ghost" id="reset" data-zh="重置演示" data-en="Reset demo">x</button></p></div>
</div></section>
</main><script src="assets/app.js"></script><script>
const $=i=>document.getElementById(i);
function show(n){['s1','s2','s3'].forEach((s,i)=>$(s).classList.toggle('hide',i!==n-1));scrollTo(0,0)}
async function card(u){$('card').innerHTML=`<div class="idcard"><img class="fp" src="brand/qcf-civ-id-mark.svg" alt=""><div class="eyebrow">CIVILIZATION ID · ${QCF.t('演示证书','DEMO CERTIFICATE')}</div><div class="num counter" id="cnum"></div><div class="serif" style="font-size:20px">${u.name||QCF.t('（未设使者名）','(no envoy name)')}</div><div class="meta" style="margin-top:14px"><dl><dt>${QCF.t('签发日期','ISSUED')}</dt><dd>${u.issued}</dd><dt>${QCF.t('签名指纹 SHA-256','SIGNATURE FINGERPRINT SHA-256')}</dt><dd class="counter small">${u.fp.slice(0,32)}<br>${u.fp.slice(32)}</dd><dt>${QCF.t('验证码','VERIFICATION CODE')}</dt><dd class="counter">${u.code}</dd><dt>${QCF.t('原有身份','ORIGINAL IDENTITY')}</dt><dd>${u.hide?QCF.t('已隐藏','Hidden'):QCF.t('可见','Visible')}</dd></dl><div>${QCF.qr(u.fp)}<div class="small mute" style="text-align:center">QR · demo</div></div></div><div class="tag small mute" style="margin-top:8px">One Human. One Civilization ID.</div></div>`;QCF.odo(document.getElementById('cnum'),'2026000000');setTimeout(()=>QCF.odo(document.getElementById('cnum'),u.id),150)}
const u=QCF.S.u;if(u&&u.verified){show(3);card(u)}else if(u){show(2);$('em2').textContent=u.email}
$('go').onclick=()=>{const e=$('em').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){QCF.toast(QCF.t('请输入有效邮箱','Please enter a valid email'));return}if(!$('ok').checked){QCF.toast(QCF.t('请先勾选同意','Please accept first'));return}
QCF.S.u={email:e,name:$('nm').value.trim(),hide:$('hide').checked,verified:false};$('em2').textContent=e;show(2)};
$('ver').onclick=async()=>{const u=QCF.S.u;u.verified=true;const st=await (await fetch('data/stats.json',{cache:'no-store'})).json();u.id=QCF.idFor(st.registered_ids+1);localStorage.setItem('qcf_regs','1');u.issued=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});u.fp=await QCF.hash(u.id+'|'+u.email+'|'+u.issued);u.code=u.fp.slice(0,6).toUpperCase();QCF.S.u=u;QCF.S.h=[];show(3);await card(u);QCF.award(5,'注册文明 ID','Civilization ID registered')};
$('reset').onclick=()=>{localStorage.removeItem('qcf_user');localStorage.removeItem('qcf_hist');localStorage.removeItem('qcf_ck');localStorage.removeItem('qcf_sh');localStorage.removeItem('qcf_regs');location.reload()};
document.addEventListener('qcf-lang',()=>{const u=QCF.S.u;if(u&&u.verified)card(u)});
</script></body></html>
